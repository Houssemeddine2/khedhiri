  <line x1="360" y1="250" x2="465" y2="235" stroke="#2A1F18" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="360" y1="258" x2="468" y2="258" stroke="#2A1F18" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="360" y1="266" x2="464" y2="278" stroke="#2A1F18" stroke-width="2.5" stroke-linecap="round"/>
