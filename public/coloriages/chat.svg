  <polygon points="200,140 175,70 240,120" fill="none" stroke="#2A1F18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Oreille droite -->
  <polygon points="440,140 465,70 400,120" fill="none" stroke="#2A1F18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
