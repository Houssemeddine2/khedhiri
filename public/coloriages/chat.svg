  <ellipse cx="375" cy="200" rx="12" ry="20" fill="none" stroke="#2A1F18" stroke-width="2"/>
  <!-- Nez -->
  <path d="M310,250 Q320,260 330,250 Q320,245 310,250 Z" fill="none" stroke="#2A1F18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bouche -->
  <path d="M320,258 Q305,275 295,270" fill="none" stroke="#2A1F18" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M320,258 Q335,275 345,270" fill="none" stroke="#2A1F18" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Moustaches gauches -->
  <line x1="280" y1="250" x2="175" y2="235" stroke="#2A1F18" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="280" y1="258" x2="172" y2="258" stroke="#2A1F18" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="280" y1="266" x2="176" y2="278" stroke="#2A1F18" stroke-width="2.5" stroke-linecap="round"/>
